# Pxxl deploy config — https://docs.pxxl.app/api/pxxl-toml
# Static Astro site: build to dist/, then serve with `serve` (not vite preview).

[build]
language = "javascript"
packageManager = "npm"
nodeVersion = "22"
installCommand = "npm install"
buildCommand = "npm run build"
startCommand = "npm start"
outputDirectory = "dist"
port = 4321
